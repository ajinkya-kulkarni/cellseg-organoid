[project]
name = "cellseg-organoid"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "cellseg-models-pytorch>=0.1.30",
    "albumentations>=2.0.8",
    "matplotlib",
    "numpy",
    "opencv-python-headless",
    "scikit-image",
    "scipy",
    "tqdm",
]

[tool.mypy]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "mypy>=2.2.0",
    "ruff>=0.15.21",
]
